services:
  - type: web
    name: finalyearproject-presenova
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    # FIX: gthread never runs eventlet.monkey_patch(), but SocketIO() uses
    # async_mode='eventlet' (main.py) since eventlet is installed. That
    # mismatch broke WebSocket upgrades and made emit() from within event
    # handlers unreliable — confirmed by direct testing against the live
    # backend (python-socketio client: WS connection failed outright;
    # start_session emitted over polling connected but never got a
    # session_started response back). The eventlet worker class makes
    # gunicorn's actual runtime match what SocketIO expects.
    startCommand: "gunicorn -k eventlet -w 1 --bind 0.0.0.0:$PORT main:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      # Pin explicitly: Render doesn't reliably honor runtime.txt anymore,
      # and an unpinned/newer Python was resolving faiss-cpu==1.9.0 to "no
      # matching distribution" since that exact version has no wheel for it.
      - key: PYTHON_VERSION
        value: "3.11.9"
      # FIX: eager startup pre-warm (sentence-transformers/torch + spaCy +
      # mediapipe + opencv) measured at 500MB+ resident memory within ~40s
      # of boot — exceeds the free plan's 512MB limit and gets OOM-killed,
      # which surfaces to users as a 502. Disabled here; models load lazily
      # on first actual use instead.
      - key: PREWARM_ML_MODELS
        value: "0"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: "presenova-fyp"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false   # Paste your Firebase service account JSON here in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      # Frontend is deployed on Firebase Hosting (presenova-fyp project),
      # not Vercel — both Hosting domain forms are included since Firebase
      # serves either depending on how the site is set up.
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://presenova-fyp.web.app,https://presenova-fyp.firebaseapp.com"
      - key: ENABLE_GRAMMAR_CHECK
        value: "1"
      - key: LANGUAGETOOL_API_URL
        value: "https://api.languagetool.org/v2"
      # Optional: uncomment and set for premium LanguageTool (higher rate limits)
      # - key: LANGUAGETOOL_API_KEY
      #   sync: false
      # - key: LANGUAGETOOL_USERNAME
      #   sync: false
    healthCheckPath: /api/health

